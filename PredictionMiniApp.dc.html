  ['f692ad2ce34badd2ac6d02c681659e5d', '2251e23fe8069bf2'],
  ['f9c007cdcfb4c90c580351448b0ac6c5', '446526808d5d118e5fc2'],
  ['ff1cc77ff95bd8c6b111e217387f72a4', '4086c4a94876806612ad6a60aed418a34e010652db3ab8a63d86dd'],
]);

const normalizeCompany = (s) => {
  const v = String(s || '').normalize('NFKC').toLowerCase().replace(/ё/g, 'е')
    .replace(/[«»"“”„'’‘`,()]/g, ' ');
  const tokens = v.split(/\s+/).filter((t) => t && !SUFFIXES.has(t.replace(/[.\-–—_]/g, '')));
  return tokens.join('').replace(/[.\-–—_\s]/g, '');
};

// SHA-256 in plain JS. It runs synchronously, so Figma can open in a new tab inside the click/Enter
// handler itself — browsers block window.open() that happens after an await.
const sha256 = (bytes) => {
  const K = [], H = [];
  for (let c = 2, n = 0; n < 64; c++) {
    let prime = true;
    for (let d = 2; d * d <= c; d++) if (c % d === 0) { prime = false; break; }
    if (!prime) continue;
    if (n < 8) H[n] = (Math.pow(c, 1 / 2) * 4294967296) | 0;
    K[n++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
  }
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 8, Math.floor(len / 536870912)); dv.setUint32(total - 4, (len * 8) >>> 0);
  const w = new Int32Array(64), rotr = (x, r) => (x >>> r) | (x << (32 - r));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const x = w[i - 15], y = w[i - 2];
      w[i] = (w[i - 16] + (rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3)) + w[i - 7] + (rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10))) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  return H.map((v) => (v >>> 0).toString(16).padStart(8, '0')).join('');
};
const utf8 = (str) => new TextEncoder().encode(str);
const nameKeystream = (key, n) => {
  const out = [];
  for (let i = 0; out.length < n; i++) {
    const hex = sha256(utf8(`${NAME_SALT}${key}:${i}`));
    for (let j = 0; j < hex.length && out.length < n; j += 2) out.push(parseInt(hex.slice(j, j + 2), 16));
  }
  return out;
};
// Returns the canonical company name for an allowed alias, or null.
const findCompany = (input) => {
  const key = normalizeCompany(input);
  const enc = key && ACCESS.get(sha256(utf8(SALT + key)).slice(0, 32));
  if (!enc) return null;
  const bytes = enc.match(/../g).map((h) => parseInt(h, 16));
  const ks = nameKeystream(key, bytes.length);
  try { return new TextDecoder().decode(new Uint8Array(bytes.map((v, i) => v ^ ks[i]))); } catch (e) { return 'unknown'; }
};

// ---- Analytics (PostHog is initialised in <head>) ---------------------------
// Fire-and-forget: a blocked or failed PostHog must never affect the page or the Figma link.
const track = (event, props, options) => {
  try { if (window.posthog && typeof window.posthog.capture === 'function') window.posthog.capture(event, props, options); } catch (e) {}
};
const CASE_NAME = 'prediction-mini-app';
// What a visitor typed when access was denied, unless it looks like personal data or junk.
const safeEnteredCompany = (raw) => {
  const v = String(raw || '').replace(/\s+/g, ' ').trim();
  const looksPersonal =
    /\S+@\S+/.test(v) ||                                    // email
    /(^|\s)(https?:\/\/|www\.)|\w\/\w/i.test(v) ||            // url
    (v.match(/\d/g) || []).length >= 7 ||                   // phone or other long number
    /\S{25,}/.test(v) ||                                    // one very long token
    /(?=\S*\d)(?=\S*[a-zа-я])\S{16,}/i.test(v);           // long mixed letter/digit string
  return looksPersonal ? '[redacted]' : v.slice(0, 80);
};
// New tab keeps the portfolio open; if the browser blocks it, open Figma in this tab instead.
const openFigma = () => {
  const w = window.open(FIGMA_URL, '_blank');
  if (w) { try { w.opener = null; } catch (e) {} } else location.href = FIGMA_URL;
};

class Component extends DCLogic {
  state = { error: '', hasValue: false };

  onClose = (e) => {
    try {
      const ref = document.referrer ? new URL(document.referrer) : null;
      if (ref && ref.origin === location.origin && ref.pathname !== location.pathname && history.length > 1) {
        e.preventDefault(); history.back();
      }
    } catch (err) {}
  };
  onInput = (e) => {
    const hasValue = e.target.value.trim() !== '';
    if (hasValue !== this.state.hasValue || this.state.error) this.setState({ hasValue, error: '' });
  };
  // This page is the access form itself: it only opens from "Open full case" (public case) or the
  // homepage card, so loading it is the gate opening. Sent once per open; typing sends nothing.
  componentDidMount() {
    track('nda_gate_opened', { case_name: CASE_NAME });
  }
  onSubmit = (e) => {
    e.preventDefault();
    const field = e.currentTarget.elements.company;
    if (!normalizeCompany(field.value)) return;
    const company = findCompany(field.value);
    if (company) {
      this.setState({ error: '' });
      // sendBeacon so the events survive if Figma has to open in this same tab
      track('company_access_granted', { company, case_name: CASE_NAME }, { transport: 'sendBeacon' });
      track('full_case_opened', { company, case_name: CASE_NAME, destination: 'figma' }, { transport: 'sendBeacon' });
      openFigma();
    } else {
      this.setState({ error: NOT_FOUND });
      field.focus();
      track('company_access_denied', { entered_company: safeEnteredCompany(field.value), case_name: CASE_NAME });
    }
  };

  renderVals() {
    const { error, hasValue } = this.state;
    return {
      error, invalid: error ? 'true' : 'false', goDisabled: !hasValue,
      onSubmit: this.onSubmit, onInput: this.onInput, onClose: this.onClose,
      publicHref: IS_FILE ? 'BankingMiniApp.dc.html' : '/banking-mini-app',
    };
  }
}
</script>
